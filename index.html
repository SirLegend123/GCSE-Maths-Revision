<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sapphire's Maths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700;800&display=swap">
<style>
/* A calm, dyslexia-friendly look: Lexend, a tinted background, big buttons, one question at a time.
   Pounds are always teal and the other money is always orange, on every screen. */
:root{
  --font:'Lexend', 'Verdana', 'Trebuchet MS', system-ui, sans-serif;
  --bg:#FBF6E4; --surface:#FFFFFF; --surface-2:#F3EEDB; --ink:#16213A; --ink-soft:#4E5873; --line:#DED6BC;
  --sun:#F4BE1E; --sun-deep:#C99700; --sun-ink:#231A00;
  --teal:#1B7F79; --teal-deep:#11605B; --teal-soft:#DDF0EE;
  --good:#2C9659; --good-deep:#1F7343; --good-soft:#DFF3E6;
  --warm:#D9822B; --warm-deep:#A9621C; --warm-soft:#FBE8D3;
  --berry:#8A4FB0; --berry-soft:#EFE4F6;
  --shadow:rgba(22,33,58,.10);
  --on-accent:#FFFFFF;
  --fs:19px; --ls:0; --ws:0;
}
:root[data-tint="sky"]{--bg:#E7F1F8}
:root[data-tint="mint"]{--bg:#E8F4EC}
:root[data-tint="rose"]{--bg:#F8EAEC}
:root[data-tint="white"]{--bg:#FFFFFF}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121722; --surface:#1A2130; --surface-2:#222B3C; --ink:#F2EFE3; --ink-soft:#B8B6AA; --line:#323D51;
    --sun:#F5C432; --sun-deep:#B88E0A; --sun-ink:#1E1600;
    --teal:#4CC2B8; --teal-deep:#2E8E86; --teal-soft:#173836;
    --good:#5DD08C; --good-deep:#3A9A62; --good-soft:#173526;
    --warm:#F0A35E; --warm-deep:#B87535; --warm-soft:#3A2818;
    --berry:#C59BE3; --berry-soft:#2E2238;
    --shadow:rgba(0,0,0,.35); --on-accent:#0E1A14; color-scheme:dark;
  }
  :root:not([data-theme="light"])[data-tint="cream"]{--bg:#17150F}
  :root:not([data-theme="light"])[data-tint="sky"]{--bg:#0F1821}
  :root:not([data-theme="light"])[data-tint="mint"]{--bg:#0F1A15}
  :root:not([data-theme="light"])[data-tint="rose"]{--bg:#1C1316}
  :root:not([data-theme="light"])[data-tint="white"]{--bg:#121722}
}
:root[data-theme="dark"]{
  --bg:#121722; --surface:#1A2130; --surface-2:#222B3C; --ink:#F2EFE3; --ink-soft:#B8B6AA; --line:#323D51;
  --sun:#F5C432; --sun-deep:#B88E0A; --sun-ink:#1E1600;
  --teal:#4CC2B8; --teal-deep:#2E8E86; --teal-soft:#173836;
  --good:#5DD08C; --good-deep:#3A9A62; --good-soft:#173526;
  --warm:#F0A35E; --warm-deep:#B87535; --warm-soft:#3A2818;
  --berry:#C59BE3; --berry-soft:#2E2238;
  --shadow:rgba(0,0,0,.35); --on-accent:#0E1A14; color-scheme:dark;
}
:root[data-theme="dark"][data-tint="cream"]{--bg:#17150F}
:root[data-theme="dark"][data-tint="sky"]{--bg:#0F1821}
:root[data-theme="dark"][data-tint="mint"]{--bg:#0F1A15}
:root[data-theme="dark"][data-tint="rose"]{--bg:#1C1316}
:root[data-size="m"]{--fs:17px}
:root[data-size="xl"]{--fs:22px}
:root[data-spacing="wide"]{--ls:.05em; --ws:.14em}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0; font-family:var(--font); font-size:var(--fs); letter-spacing:var(--ls); word-spacing:var(--ws); line-height:1.6; background:var(--bg); color:var(--ink); transition:background .2s}
button,input{font:inherit; letter-spacing:inherit; word-spacing:inherit; color:inherit}
:focus-visible{outline:3px solid var(--teal); outline-offset:3px; border-radius:10px}
[hidden]{display:none!important}
.app{max-width:880px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:12px 48px; display:flex; flex-direction:column; gap:20px}
h1,h2,h3{margin:0; line-height:1.25; text-wrap:balance; font-weight:800}
h1{font-size:1.65em} h2{font-size:1.3em} h3{font-size:1.05em}
p{margin:0}
.muted{color:var(--ink-soft)}
.small{font-size:.85em}
.num{font-variant-numeric:tabular-nums; white-space:nowrap}

/* top bar */
.bar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding-block:6px}
.brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.05em; margin-right:auto; background:none; border:0; padding:4px; cursor:pointer; text-align:left}
.brand .logo{width:38px; height:38px; border-radius:12px; background:var(--sun); color:var(--sun-ink); display:grid; place-items:center; box-shadow:0 3px 0 var(--sun-deep); flex:none}
.chip{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; background:var(--surface); border:2px solid var(--line); font-weight:700; font-size:.85em; white-space:nowrap}
.iconbtn{width:48px; height:48px; flex:none; border-radius:14px; border:2px solid var(--line); background:var(--surface); display:grid; place-items:center; cursor:pointer}
.iconbtn:hover{border-color:var(--teal)}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:56px; padding:12px 22px; border-radius:18px; border:0; font-weight:700; font-size:1em; cursor:pointer; background:var(--sun); color:var(--sun-ink); box-shadow:0 5px 0 var(--sun-deep); transition:transform .08s, box-shadow .08s; text-align:center; text-decoration:none}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--sun-deep)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.teal{background:var(--teal); color:var(--on-accent); box-shadow:0 5px 0 var(--teal-deep)}
.btn.teal:active{box-shadow:0 1px 0 var(--teal-deep)}
.btn.ghost{background:var(--surface); color:var(--ink); box-shadow:0 4px 0 var(--line); border:2px solid var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn.sm{min-height:46px; padding:8px 16px; font-size:.9em; border-radius:14px}
.row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.row > *{min-width:0}
.back{display:inline-flex; align-items:center; gap:8px; background:none; border:0; cursor:pointer; font-weight:700; color:var(--teal); padding:6px 0; align-self:flex-start}

.panel{background:var(--surface); border:2px solid var(--line); border-radius:24px; padding:22px; display:flex; flex-direction:column; gap:14px; box-shadow:0 6px 0 var(--shadow)}
.hello{display:flex; flex-direction:column; gap:8px}
.eyebrow{font-size:.75em; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--teal)}

/* topic and activity cards */
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap:14px}
.tcard{background:var(--surface); border:2px solid var(--line); border-radius:22px; padding:18px; display:flex; gap:14px; align-items:center; cursor:pointer; text-align:left; box-shadow:0 5px 0 var(--shadow); transition:transform .1s}
.tcard:hover{transform:translateY(-2px); border-color:var(--teal)}
.tcard .ti{width:58px; height:58px; flex:none; border-radius:18px; background:var(--sun); color:var(--sun-ink); display:grid; place-items:center; font-size:1.5em; font-weight:800}
.tcard .info{display:flex; flex-direction:column; gap:4px; min-width:0}
.soon{border-style:dashed; box-shadow:none; background:transparent; cursor:default; color:var(--ink-soft)}
.soon:hover{transform:none; border-color:var(--line)}

.learnbox{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media (max-width:560px){.learnbox{grid-template-columns:1fr}}
.acts{display:flex; flex-direction:column; gap:14px}
.act{background:var(--surface); border:2px solid var(--line); border-radius:22px; padding:16px 18px; display:flex; flex-direction:column; gap:12px; box-shadow:0 5px 0 var(--shadow)}
.act .top{display:flex; gap:14px; align-items:flex-start}
.act .n{flex:none; width:44px; height:44px; border-radius:50%; background:var(--teal); color:var(--on-accent); font-weight:800; display:grid; place-items:center}
.act .top > div{min-width:0; display:flex; flex-direction:column; gap:4px}
.levels{display:flex; gap:10px; flex-wrap:wrap}
.lvl{min-height:52px; padding:8px 16px; border-radius:16px; border:3px solid var(--line); background:var(--surface); cursor:pointer; font-weight:700; display:inline-flex; align-items:center; gap:10px; box-shadow:0 4px 0 var(--line); text-align:left}
.lvl:hover{border-color:var(--teal)}
.lvl:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line)}
.lvl .st{display:inline-flex; gap:2px}

/* play */
.playtop{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.dots{display:flex; gap:6px; flex-wrap:wrap; flex:1; min-width:0}
.dots i{width:18px; height:18px; border-radius:50%; background:var(--surface-2); border:2px solid var(--line)}
.dots i.done{background:var(--good); border-color:var(--good)}
.dots i.help{background:var(--sun); border-color:var(--sun-deep)}
.dots i.now{border-color:var(--ink); border-width:3px}
.big-card{background:var(--surface); border:3px solid var(--ink); border-radius:28px; padding:24px; display:flex; flex-direction:column; gap:20px; box-shadow:0 8px 0 var(--ink)}
@media (max-width:480px){.big-card{padding:18px 16px}}
.qhead{display:flex; gap:12px; align-items:flex-start; justify-content:space-between}
.qhead > div{min-width:0; display:flex; flex-direction:column; gap:10px}
.qtext{font-size:1.3em; font-weight:700; line-height:1.45}
.ask{display:flex; gap:12px; align-items:center; justify-content:space-between; font-size:1.12em; font-weight:800}
.stepno{display:inline-grid; place-items:center; width:34px; height:34px; border-radius:50%; background:var(--teal); color:var(--on-accent); font-size:.8em; margin-right:8px; flex:none}
.donesteps{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.donesteps li{display:flex; gap:12px; align-items:center; background:var(--good-soft); border-radius:14px; padding:8px 14px; font-weight:600}
.donesteps li svg{flex:none; color:var(--good-deep)}
.choices{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media (max-width:520px){.choices{grid-template-columns:1fr}}
.choice{min-height:72px; border-radius:18px; border:3px solid var(--line); background:var(--surface); padding:12px 16px; text-align:left; font-weight:700; cursor:pointer; box-shadow:0 4px 0 var(--line); display:flex; gap:12px; align-items:center}
.choice:hover:not(:disabled){border-color:var(--teal)}
.choice:disabled{cursor:default}
.choice.wrong{border-color:var(--line); background:var(--surface-2); box-shadow:none; opacity:.55}
.choice.right{border-color:var(--good); background:var(--good-soft); box-shadow:0 4px 0 var(--good)}
.choice .op{font-size:1.5em; font-weight:800; min-width:1.4em; text-align:center}
.feedback{border-radius:20px; padding:16px 18px; display:flex; flex-direction:column; gap:12px}
.feedback.ok{background:var(--good-soft)}
.feedback.notyet{background:var(--warm-soft)}
.feedback.tip{background:var(--teal-soft)}
.feedback .head{font-weight:800; font-size:1.1em; display:flex; gap:10px; align-items:center}

/* money: pounds always teal, the other money always orange */
.m{font-weight:800; white-space:nowrap; font-variant-numeric:tabular-nums}
.m.gbp{color:var(--teal-deep)}
.m.fx{color:var(--warm-deep)}
:root[data-theme="dark"] .m.gbp{color:var(--teal)} :root[data-theme="dark"] .m.fx{color:var(--warm)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .m.gbp{color:var(--teal)} :root:not([data-theme="light"]) .m.fx{color:var(--warm)}}
.coin{display:inline-grid; place-items:center; width:1.9em; height:1.9em; border-radius:50%; font-weight:800; flex:none; color:var(--on-accent); font-size:1em; line-height:1}
.coin.gbp{background:var(--teal); box-shadow:0 3px 0 var(--teal-deep)}
.coin.fx{background:var(--warm); box-shadow:0 3px 0 var(--warm-deep); color:#1E1000}
.coin.big{width:2.6em; height:2.6em; font-size:1.2em}
.qtext .rate{font-size:.75em; margin-bottom:6px}
.rate{display:inline-flex; align-items:center; gap:10px; flex-wrap:wrap; align-self:flex-start; background:var(--surface-2); border:2px solid var(--line); border-radius:16px; padding:8px 14px; font-weight:800; font-size:1.1em}

/* the money bridge */
.bridge{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr); gap:10px; align-items:center}
.bank{border-radius:20px; padding:12px 8px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; min-width:0}
.bank.gbp{background:var(--teal-soft); border:3px solid var(--teal)}
.bank.fx{background:var(--warm-soft); border:3px solid var(--warm)}
.bank b{font-size:.95em}
.bank .amt{font-size:1.15em}
.bank .homei{display:inline-flex; align-items:center; gap:4px; font-size:.75em; font-weight:700; color:var(--teal-deep)}
:root[data-theme="dark"] .bank .homei{color:var(--teal)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bank .homei{color:var(--teal)}}
.ways{display:flex; flex-direction:column; gap:14px; min-width:0}
.way{display:flex; flex-direction:column; align-items:center; gap:2px; border-radius:16px; padding:6px 8px; border:3px solid transparent; transition:background .2s}
.way .opt{font-size:1.25em; font-weight:800; white-space:nowrap}
.way small{font-size:.72em; font-weight:700; color:var(--ink-soft); text-align:center; line-height:1.3}
.way.on{background:var(--sun); border-color:var(--sun-deep); color:var(--sun-ink)}
.way.on small{color:var(--sun-ink)}
.way.off{opacity:.35}
.arrow{position:relative; height:5px; width:calc(100% - 18px); background:currentColor; border-radius:3px; margin:4px 9px}
.arrow.r::after,.arrow.l::after{content:""; position:absolute; top:50%; transform:translateY(-50%); border:9px solid transparent}
.arrow.r::after{right:-16px; border-left:14px solid currentColor}
.arrow.l::after{left:-16px; border-right:14px solid currentColor}
@media (max-width:420px){.bridge{gap:6px} .way .opt{font-size:1.05em} .bank{padding:10px 4px}}

.steps4{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; counter-reset:s}
.steps4 li{display:flex; gap:12px; align-items:flex-start; counter-increment:s}
.steps4 li::before{content:counter(s); flex:none; width:34px; height:34px; border-radius:50%; background:var(--teal); color:var(--on-accent); font-weight:800; display:grid; place-items:center; font-size:.85em}
.hook{display:flex; gap:12px; align-items:flex-start; background:var(--sun); color:var(--sun-ink); border-radius:16px; padding:12px 16px; font-weight:700}
.hook svg{flex:none; margin-top:3px}
.sum{font-size:1.25em; font-weight:800; background:var(--surface-2); border-radius:14px; padding:10px 16px; align-self:flex-start; font-variant-numeric:tabular-nums}
.ladder{border-collapse:collapse; font-variant-numeric:tabular-nums}
.ladder td{border:2px solid var(--line); padding:8px 14px; text-align:center; font-weight:700}

/* calculator */
.calc{display:flex; flex-direction:column; gap:10px; max-width:380px; width:100%; align-self:center}
.screen{background:var(--surface-2); border:3px solid var(--ink); border-radius:18px; padding:10px 16px; min-height:84px; display:flex; flex-direction:column; align-items:flex-end; justify-content:center; font-variant-numeric:tabular-nums; overflow:hidden}
.screen .was{font-size:.85em; color:var(--ink-soft); min-height:1.4em}
.screen .now{font-size:1.7em; font-weight:800; word-break:break-all; text-align:right}
.screen .now .unit{color:var(--ink-soft); margin-right:4px}
.keys{display:grid; grid-template-columns:repeat(4, 1fr); gap:8px}
.key{min-height:58px; border-radius:14px; border:2px solid var(--line); background:var(--surface); font-size:1.35em; font-weight:800; cursor:pointer; box-shadow:0 3px 0 var(--line); touch-action:manipulation; -webkit-tap-highlight-color:transparent}
.key:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line)}
.key.op{background:var(--berry-soft); border-color:var(--berry-soft)}
.key.op span{display:block; font-size:.45em; font-weight:700; line-height:1}
.key.fn{font-size:1em; color:var(--ink-soft)}
.key.eq{background:var(--teal-soft); border-color:var(--teal)}

/* done */
.finish{align-items:center; text-align:center}
.stars{display:flex; gap:10px; justify-content:center}
.stars svg{animation:pop .4s both}
.stars svg:nth-child(2){animation-delay:.15s} .stars svg:nth-child(3){animation-delay:.3s}
@keyframes pop{0%{transform:scale(.6); opacity:0}100%{transform:scale(1); opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}

/* learn slides */
.slide{min-height:300px}
.slide .vis{display:flex; flex-direction:column; gap:14px}
.sdots{display:flex; gap:8px; justify-content:center}
.sdots i{width:14px; height:14px; border-radius:50%; background:var(--line)}
.sdots i.now{background:var(--teal)}

/* settings and overlay */
.seg{display:flex; gap:8px; flex-wrap:wrap}
.seg button{min-height:48px; padding:8px 16px; border-radius:14px; border:3px solid var(--line); background:var(--surface); cursor:pointer; font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--teal); background:var(--teal-soft)}
.swatch{width:20px; height:20px; border-radius:50%; display:inline-block; border:2px solid var(--line); vertical-align:middle; margin-right:6px}
.overlay{position:fixed; inset:0; background:rgba(10,14,24,.55); z-index:30; display:flex; align-items:flex-start; justify-content:center; overflow-y:auto; padding:24px 16px}
.overlay .panel{max-width:640px; width:100%}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:12px 20px; border-radius:16px; font-weight:600; z-index:50; max-width:calc(100% - 32px); text-align:center}
.confetti{position:fixed; inset:0; pointer-events:none; z-index:40; width:100%; height:100%}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="overlayRoot"></div>
<div id="toastRoot"></div>
<!-- The app shell, then one file per topic. To add a topic, add its file here. -->
<script src="app.js"></script>
<script src="topics/exchange-rates.js"></script>
<script>App.start();</script>
</body>
</html>
